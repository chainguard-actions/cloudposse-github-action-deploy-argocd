name: 'Deploy ArgoCD'
description: 'Deploy on Kubernetes with ArgoCD'
author: hello@cloudposse.com
branding:
  icon: 'cpu'
  color: 'white'
inputs:
  cluster:
    description: Cluster name
    required: true
  aws-region:
    description: AWS region
    required: false
    default: us-east-1
  path:
    description: The path where lives the helmfile or helm chart.
    required: true
  toolchain:
    description: Toolchain ('helm', 'helmfile')
    required: false
    default: helmfile
  ssm-path:
    required: false
    default: ''
    description: SSM path to read environment secrets
  operation:
    description: Operation with helmfiles. (valid options - `deploy`, `destroy`)
    required: true
    default: deploy
  environment:
    description: Helmfile environment
    required: false
    default: preview
  repository:
    description: Application GitHub repository full name
    required: true
  ref:
    description: Git ref
    required: true
  gitref-sha:
    description: Git SHA (Depricated. Use `ref` instead)
    required: false
    default: ''
  namespace:
    description: Kubernetes namespace
    required: true
  application:
    description: Application name
    required: true
  image:
    description: Docker image
    required: true
  image-tag:
    description: Docker image tag
    required: true
  debug:
    description: Debug mode
    default: 'false'
    required: false
  values_file:
    description: Helm values file, this can be a single file or a comma separated list of files
    default: ""
    required: false
  release_label_name:
    description: The name of the label used to describe the helm release
    default: "release"
    required: false
  github-pat:
    description: Github PAT to access argocd configuration repository
    required: true
  commit-status-github-token:
    description: Github token to access the app repository. Defaults to github-pat if not set.
    required: false
  synchronously:
    description: "Wait until ArgoCD successfully apply the changes"
    default: 'false'
  check-retry-count:
    description: 'Check retry count (for synchronously mode)'
    required: false
    default: "5"
  check-retry-interval:
    description: 'Check retry interval (in seconds) (for synchronously mode)'
    required: false
    default: "10"
  commit-retry-count:
    description: 'Commit retry count'
    required: false
    default: "4"
  commit-retry-interval:
    description: 'Commit retry interval (in seconds)'
    required: false
    default: "10"
  commit-timeout:
    description: 'Commit timeout (in seconds)'
    required: false
    default: "60"
  helm-dependency-build:
    description: 'Run helm dependency build, only for helm toolchain, `true` or `false`'
    required: false
    default: "false"
  helm-args:
    description: 'Additional helm arguments'
    required: false
    default: ""
  helmfile-args:
    description: 'Additional helmfile arguments'
    required: false
    default: ""
  helm-version:
    description: "Helm version"
    required: false
    default: "v3.20.1"
  helmfile-version:
    description: "Helmfile version"
    required: false
    default: "v1.4.3"    
  kube-version:
    description: "Kubernetes version for helm/helmfile rendering (e.g. `1.28`). When provided, skips SSM metadata lookup via chamber."
    required: false
    default: ""    
outputs:
  webapp-url:
    description: "Web Application url"
    value: ${{ steps.result.outputs.webapp_url }}
  sha:
    description: "Git commit SHA into argocd repo"
    value: ${{ steps.git.outputs.sha }}
runs:
  using: "composite"
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Setup yq
      uses: chainguard-actions/dcarbone-install-yq-action@98f5e06c9c8587f38449c1c5fc8229abc6f1650d # v1.3.1
      with:
        version: v4.28.1
        download-compressed: true
        force: true

    - name: Setup helmfile
      uses: chainguard-actions/mamezou-tech-setup-helmfile@3640fc1c9e7d8325346b59cc06877c193489af40 # v2.2.0
      if: ${{ inputs.operation == 'deploy' }}
      with:
        helmfile-version: "${{ inputs.helmfile-version }}"
        helm-version: "${{ inputs.helm-version }}"
        install-kubectl: false

    - name: Setup node
      uses: chainguard-actions/actions-setup-node@e20a37d07d82e3bf48155b3fc8ee09a87c6c907d # v6
      with:
        node-version: 24

    - name: Install git-url-parse
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/action-deps"
        cd "$RUNNER_TEMP/action-deps"
        npm install git-url-parse@14.0.0 --no-save
      env:
        NPM_CONFIG_USERCONFIG: /dev/null

    - name: Parse git URL for destination
      uses: chainguard-actions/actions-github-script@5ae8e66bc55d3cfc641b4dd912088e3996b815c2 # v9.0.0, node 20
      id: destination
      env:
        NODE_PATH: ${{ runner.temp }}/action-deps/node_modules
        CLUSTER_URL: ${{ inputs.cluster }}
      with:
        script: |
          const GitUrlParse = require("git-url-parse");
          function run(url) {
            try { 
              console.log("url: %s", url)
              const urlObj = GitUrlParse(url);
              core.setOutput('result', JSON.stringify(urlObj));
              const keys = Object.keys(urlObj);
              keys.forEach(key=>{
                if(typeof urlObj[key] === 'string' || urlObj[key] === null){
                  core.setOutput(key, urlObj[key]);
                }
              })
            } 
            catch (error) {
              core.setFailed(error.message);
            }
          }
          run(process.env.CLUSTER_URL)

    - id: destination_dir
      shell: bash
      run: |-
        echo "name=$(echo $RANDOM | md5sum | head -c 20)" >> $GITHUB_OUTPUT

    - name: Config
      id: config
      uses: chainguard-actions/cloudposse-github-action-yaml-config-query@83f84fa262cbd8aee907d7d03a812d7450fdec5c # v1.0.1
      with:
        config: |-
          tmp: ./tmp/${{ steps.destination.outputs.filepath }}/${{ inputs.namespace }}/${{ inputs.application }}
          path: ${{ steps.destination.outputs.filepath }}/${{ inputs.namespace }}/${{ inputs.application }}

    - name: Checkout Argo Configuration
      uses: chainguard-actions/actions-checkout@40e53bf063d4f87f0a6e0a83231c09bcfb22bc19 # v6
      with:
        repository: ${{ steps.destination.outputs.owner }}/${{ steps.destination.outputs.name }}
        ref: ${{ steps.destination.outputs.ref }}
        token: ${{ inputs.github-pat }}
        path: ${{ steps.destination_dir.outputs.name }}

    - name: Setup chamber
      if: ${{ inputs.operation == 'deploy' && inputs.ssm-path != '' }}
      shell: bash
      env:
        version: v2.14.1
      run: |
        set -x
        os=$(uname -s | tr '[:upper:]' '[:lower:]')
        arch=""
        case $(uname -m) in
          x86_64)
            arch="amd64"
            ;;
          aarch64)
            arch="arm64"
            ;;
          arch64)
            arch="arm64"
            ;;
          *)
            echo "Unsupported architecture $(uname -m)"
            exit 1
            ;;
        esac
        curl -LOs https://github.com/segmentio/chamber/releases/download/${version}/chamber-${version}-${os}-${arch}
        sudo install chamber-${version}-${os}-${arch} /usr/local/bin/chamber

    - name: Read platform context
      if: ${{ inputs.operation == 'deploy' && inputs.ssm-path != '' }}
      shell: bash
      env:
        SSM_PATH: ${{ inputs.ssm-path }}
        HELM_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        chamber --verbose export "$SSM_PATH/$HELM_ENVIRONMENT" --format yaml --output-file ./platform.yaml

    - name: YQ Platform settings
      if: ${{ inputs.operation == 'deploy' && inputs.ssm-path != '' }}
      shell: bash
      run: |
        sudo chmod 777 ./platform.yaml 
        yq --exit-status --no-colors --inplace eval '{"platform": .}' ./platform.yaml

    - name: Create empty platform context
      if: ${{ inputs.operation == 'deploy' && inputs.ssm-path == '' }}
      shell: bash
      run: |
        echo 'platform: {}' > ./platform.yaml

    - name: Read platform metadata
      if: ${{ inputs.operation == 'deploy' && inputs.ssm-path != '' }}
      shell: bash
      env:
        SSM_PATH: ${{ inputs.ssm-path }}
      run: |
        chamber --verbose export "$SSM_PATH/_metadata" --format yaml --output-file ./_metadata.yaml

    - name: YQ Platform settings
      if: ${{ inputs.operation == 'deploy' && inputs.ssm-path != '' }}
      shell: bash
      id: metadata
      run: |
        for output in $(yq --exit-status --no-colors eval-all '. | to_entries | map( .key + "=" + .value ) | join("\n")' ./_metadata.yaml); do
          safe=$(printf '%s' "${output}" | tr -d '\n\r')
          printf '%s\n' "${safe}" >> "$GITHUB_OUTPUT" ;
        done

    - name: Resolve kube version
      id: resolved_kube_version
      if: ${{ inputs.operation == 'deploy' }}
      shell: bash
      env:
        INPUT_KUBE_VERSION: ${{ inputs.kube-version }}
        SSM_PATH: ${{ inputs.ssm-path }}
        METADATA_KUBE_VERSION: ${{ steps.metadata.outputs.kube_version }}
      run: |
        kube_version="$INPUT_KUBE_VERSION"
        if [ -z "$kube_version" ] && [ -n "$SSM_PATH" ]; then
          kube_version="$METADATA_KUBE_VERSION"
        fi
        safe=$(printf '%s' "$kube_version" | tr -d '\n\r')
        echo "value=$safe" >> "$GITHUB_OUTPUT"

    - name: Context
      if: ${{ inputs.operation == 'deploy' }}
      id: arguments
      uses: chainguard-actions/cloudposse-github-action-yaml-config-query@83f84fa262cbd8aee907d7d03a812d7450fdec5c # v1.0.1
      with:
        query: ."${{ steps.resolved_kube_version.outputs.value == '' }}"
        config: |-
          true: 
            kube_version: ""
          false:
            kube_version: --kube-version=${{ steps.resolved_kube_version.outputs.value }}      


    - name: Ensure argocd repo structure
      if: ${{ inputs.operation == 'deploy' }}
      shell: bash
      env:
        CONFIG_TMP: ${{ steps.config.outputs.tmp }}
      run: |
        mkdir -p "$CONFIG_TMP/manifests"

    - name: Helmfile render
      if: ${{ inputs.toolchain == 'helmfile' && inputs.operation == 'deploy' }}
      shell: bash
      run: |
        extra_args=()
        if [ -n "$HELMFILE_ARGS" ]; then
          printf '%s' "$HELMFILE_ARGS" | xargs -r true >/dev/null
          while IFS= read -r -d '' t; do extra_args+=("$t"); done \
            < <(printf '%s' "$HELMFILE_ARGS" | xargs -r sh -c 'printf "%s\0" "$@"' sh)
        fi
        helmfile --namespace "$HELM_NAMESPACE" \
          --environment "$HELM_ENVIRONMENT" \
          --file "$CHART_PATH" \
          --state-values-file "$(pwd)/platform.yaml" \
          template \
          --args="$KUBE_VERSION_ARG" \
          "${extra_args[@]}" > "$CONFIG_TMP/manifests/resources.yaml"
      env:
        IMAGE_NAME: ${{ inputs.image }}
        IMAGE_TAG: ${{ inputs.image-tag }}
        HELM_NAMESPACE: ${{ inputs.namespace }}
        HELM_ENVIRONMENT: ${{ inputs.environment }}
        CHART_PATH: ${{ inputs.path }}
        KUBE_VERSION_ARG: ${{ steps.arguments.outputs.kube_version }}
        HELMFILE_ARGS: ${{ inputs.helmfile-args }}
        CONFIG_TMP: ${{ steps.config.outputs.tmp }}
        
    - name: Build Helm Dependencies
      if: ${{ inputs.toolchain == 'helm' && inputs.operation == 'deploy' && inputs.helm-dependency-build == 'true'}}
      shell: bash
      env:
        CHART_PATH: ${{ inputs.path }}
      run: |
        helm dependency build "$CHART_PATH"
        
    - name: Helm raw render
      if: ${{ inputs.toolchain == 'helm' && inputs.operation == 'deploy' }}
      shell: bash
      run: |
        IFS=', ' read -r -a array <<< "$VALUES_FILE"
        values_args=()
        for element in "${array[@]}"; do
          if [ -n "$element" ]; then values_args+=(--values "$element"); fi
        done

        extra_args=()
        if [ -n "$HELM_ARGS" ]; then
          printf '%s' "$HELM_ARGS" | xargs -r true >/dev/null
          while IFS= read -r -d '' t; do extra_args+=("$t"); done \
            < <(printf '%s' "$HELM_ARGS" | xargs -r sh -c 'printf "%s\0" "$@"' sh)
        fi
        
        helm template "$APPLICATION" "$CHART_PATH" \
          --set "image.repository=$IMAGE_NAME" \
          --set "global.image.repository=$IMAGE_NAME" \
          --set "image.tag=$IMAGE_TAG" \
          --set "global.image.tag=$IMAGE_TAG" \
          --set "environment=$HELM_ENVIRONMENT" \
          --create-namespace=true \
          --namespace "$HELM_NAMESPACE" \
          --set ingress.default.hosts.example=test \
          --values "$(pwd)/platform.yaml" \
          "${values_args[@]}" \
          "${extra_args[@]}" \
          ${KUBE_VERSION_ARG:+"$KUBE_VERSION_ARG"} \
        > "$CONFIG_TMP/manifests/resources.yaml"
      env:
        IMAGE_NAME: ${{ inputs.image }}
        IMAGE_TAG: ${{ inputs.image-tag }}
        VALUES_FILE: ${{ inputs.values_file }}
        APPLICATION: ${{ inputs.application }}
        CHART_PATH: ${{ inputs.path }}
        HELM_ENVIRONMENT: ${{ inputs.environment }}
        HELM_NAMESPACE: ${{ inputs.namespace }}
        HELM_ARGS: ${{ inputs.helm-args }}
        KUBE_VERSION_ARG: ${{ steps.arguments.outputs.kube_version }}
        CONFIG_TMP: ${{ steps.config.outputs.tmp }}

    - name: Get Webapp
      if: ${{ inputs.operation == 'deploy' }}
      id: result
      shell: bash
      env:
        CONFIG_TMP: ${{ steps.config.outputs.tmp }}
      run: |-
        WEBAPP_URL=$( \
          yq -N eval-all '[.metadata.annotations["outputs.platform.cloudposse.com/webapp-url"] | select(. != null)] | .[0]' \
            "$CONFIG_TMP/manifests/resources.yaml" \
        )
        safe=$(printf '%s' "$WEBAPP_URL" | tr -d '\n\r')
        echo "webapp_url=${safe}" >> "$GITHUB_OUTPUT"

    - name: Deplicated Ref
      if: ${{ inputs.operation == 'deploy' }}
      id: ref
      uses: chainguard-actions/cloudposse-github-action-yaml-config-query@83f84fa262cbd8aee907d7d03a812d7450fdec5c # v1.0.1
      with:
        query: ."${{ inputs.gitref-sha == '' }}"
        config: |-
          true: 
            value: ${{ inputs.ref }}
          false:
            value: ${{ inputs.gitref-sha }}      

    - name: Config render
      if: ${{ inputs.operation == 'deploy' }}
      uses: chainguard-actions/1arp-create-a-file-action@76bde6d654b8ab33983fb16aa835e786a6cfc44a # 0.4
      with:
        path: ${{ steps.config.outputs.tmp }}
        file: config.yaml
        content: |-
          app_repository: ${{ inputs.repository }}
          app_commit: ${{ steps.ref.outputs.value }}
          app_hostname: ${{ steps.result.outputs.webapp_url }}
          name: ${{ inputs.namespace }}.${{ inputs.application }}
          namespace: ${{ inputs.namespace }}
          manifests: ${{ steps.config.outputs.path }}/manifests

    - name: Push to Github
      uses: chainguard-actions/nick-fields-retry@bbf16f7f3fafa65d33645663c4f31becd0078797 # v4
      id: git
      env:
        DEST_DIR: ${{ steps.destination_dir.outputs.name }}
        DEST_REF: ${{ steps.destination.outputs.ref }}
        OPERATION: ${{ inputs.operation }}
        CONFIG_PATH: ${{ steps.config.outputs.path }}
      with:
        max_attempts: ${{ inputs.commit-retry-count }}
        timeout_seconds: ${{ inputs.commit-timeout }}
        retry_wait_seconds: ${{ inputs.commit-retry-interval }}
        shell: bash
        command: |-
          set -e
          
          git config --global user.email "bot@example.com"
          git config --global user.name "cloudpossebot"

          pushd "./$DEST_DIR"
          
          git reset --hard "origin/$DEST_REF"
          git pull --rebase
          
          popd
          
          case "$OPERATION" in
        
            deploy)
              cp -r ./tmp/* "./$DEST_DIR/"
            ;;
          
            destroy)
              rm -rf "./$DEST_DIR/$CONFIG_PATH"
            ;;
          
            *)
              echo "Operation should be 'deploy' or 'destroy'"
              exit 1;
            ;;
          esac          
          
          pushd "./$DEST_DIR"
          
          git add -A
          git status
          git diff-index --quiet HEAD || git commit -m "Deploy $GITHUB_REPOSITORY SHA $GITHUB_SHA RUN $GITHUB_RUN_ID ATEMPT $GITHUB_RUN_ATTEMPT"
          git push origin "$DEST_REF"

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          
          popd

    - name: Select GitHub Token for Sync Mode
      id: commit_status_github_token
      if: ${{ inputs.synchronously == 'true' && inputs.operation == 'deploy' }}
      shell: bash
      env:
        COMMIT_STATUS_TOKEN: ${{ inputs.commit-status-github-token }}
        GITHUB_PAT: ${{ inputs.github-pat }}
      run: |-
        if [ -z "$COMMIT_STATUS_TOKEN" ]; then
          token=$(printf '%s' "$GITHUB_PAT" | tr -d '\n\r')
        else
          token=$(printf '%s' "$COMMIT_STATUS_TOKEN" | tr -d '\n\r')
        fi
        echo "token=${token}" >> "$GITHUB_OUTPUT"

    - uses: chainguard-actions/cloudposse-github-action-wait-commit-status@c6648a91c6125933467b85bcc5d584e321ead4b3 # v0.2.1
      if: ${{ inputs.synchronously == 'true' && inputs.operation == 'deploy' }}
      with:
        repository: ${{ inputs.repository }}
        sha: ${{ inputs.ref }}
        status: "continuous-delivery/${{ inputs.namespace }}.${{ inputs.application }}"
        expected_state: "success"
        token: ${{ steps.commit_status_github_token.outputs.token }}
        check-retry-count: ${{ inputs.check-retry-count }}
        check-retry-interval: ${{ inputs.check-retry-interval }}      
