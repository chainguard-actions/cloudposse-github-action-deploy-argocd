name: Test commit-status-github-token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          cluster: https://github.com/nonexistent-org/nonexistent-argocd-config
          aws-region: us-east-1
          path: helmfile.yaml
          toolchain: helmfile
          operation: deploy
          environment: preview
          repository: nonexistent-org/nonexistent-app
          ref: abc1234
          namespace: test-ns
          application: test-app
          image: nginx
          image-tag: latest
          github-pat: ${{ github.token }}
          commit-status-github-token: ${{ github.token }}
          synchronously: "false"
          debug: "false"

      - name: Assert action ran (fails gracefully on nonexistent ArgoCD repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (nonexistent repo may have been reachable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (nonexistent ArgoCD config repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
