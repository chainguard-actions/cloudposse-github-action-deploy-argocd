name: Test commit-status-github-token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Deploy with commit-status-github-token
        id: action
        uses: .
        continue-on-error: true
        with:
          cluster: "git@github.com:example-org/argocd-config.git"
          path: "deploy/helmfile.yaml"
          operation: deploy
          environment: preview
          repository: "example-org/example-app"
          ref: "abc1234"
          namespace: "preview"
          application: "my-app"
          image: "nginx"
          image-tag: "latest"
          github-pat: ${{ github.token }}
          commit-status-github-token: ${{ github.token }}
          synchronously: "true"
          check-retry-count: "1"
          check-retry-interval: "1"
          commit-retry-count: "1"
          commit-retry-interval: "1"
          commit-timeout: "30"

      - name: Assert action ran (fails gracefully on sentinel/missing ArgoCD repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected — sentinel repo or missing ArgoCD config repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
