name: Test commit-status-github-token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with separate commit status token (expects failure at checkout)
        id: action
        uses: .
        continue-on-error: true
        with:
          cluster: "https://github.com/nonexistent-org-xyz-123/nonexistent-argocd-config-repo.git"
          path: "tests/fixtures/helmfile/helmfile.yaml"
          toolchain: helmfile
          operation: deploy
          environment: preview
          repository: "test-owner/test-app"
          ref: "abc1234def5678"
          namespace: "test-namespace"
          application: "test-app"
          image: "nginx"
          image-tag: "1.21.0"
          synchronously: "true"
          check-retry-count: "1"
          check-retry-interval: "1"
          github-pat: ${{ secrets.GITHUB_TOKEN }}
          commit-status-github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert action failed (nonexistent ArgoCD config repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (nonexistent repo), got: $OUTCOME"
            exit 1
          fi
          echo "PASS: commit-status-github-token accepted; action failed at checkout of nonexistent repo"
