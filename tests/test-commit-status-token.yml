name: Test commit-status-github-token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git config
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - id: action
        uses: .
        continue-on-error: true
        with:
          cluster: "https://github.com/cloudposse/argocd-deploy-non-prod-test.git"
          path: "deploy/myapp"
          operation: deploy
          environment: preview
          repository: "cloudposse/example-app"
          ref: "abc1234def5678901234567890123456789012ab"
          namespace: test-ns
          application: myapp
          image: "nginx"
          image-tag: "latest"
          synchronously: "true"
          github-pat: ${{ github.token }}
          commit-status-github-token: ${{ github.token }}

      - name: Assert action ran with commit-status-github-token input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected — sentinel repo or missing ArgoCD infra)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
