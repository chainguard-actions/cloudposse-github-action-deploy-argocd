name: Test commit-status-github-token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          cluster: github.com/example-org/argocd-config
          path: ./charts/myapp
          operation: deploy
          environment: preview
          repository: example-org/myapp
          ref: abc1234def5678901234567890123456789012ab
          namespace: preview
          application: myapp
          image: nginx
          image-tag: "1.25"
          github-pat: ${{ secrets.GITHUB_TOKEN }}
          commit-status-github-token: ${{ secrets.GITHUB_TOKEN }}
          synchronously: "true"
          check-retry-count: "1"
          check-retry-interval: "5"
          commit-retry-count: "1"
          commit-retry-interval: "5"
          commit-timeout: "30"

      - name: Assert action ran (commit-status-github-token input accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with commit-status-github-token"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo / missing ArgoCD config is expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
