name: Test deploy helm toolchain
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test deploy with helm toolchain (expects failure at checkout step)
        id: action-deploy-helm
        uses: .
        continue-on-error: true
        with:
          cluster: "https://github.com/nonexistent-org-xyz-123/nonexistent-argocd-config-repo.git"
          path: "tests/fixtures/helm/chart"
          toolchain: helm
          operation: deploy
          environment: staging
          repository: "test-owner/test-app"
          ref: "deadbeef1234"
          namespace: "staging-namespace"
          application: "my-app"
          image: "myregistry/myapp"
          image-tag: "v2.0.0"
          helm-dependency-build: "false"
          github-pat: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert action failed at checkout (not at input parsing)
        env:
          OUTCOME: ${{ steps.action-deploy-helm.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the ArgoCD config repo doesn't exist
          # This confirms that URL parsing and early steps worked correctly
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (nonexistent repo), got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when ArgoCD config repo doesn't exist"
