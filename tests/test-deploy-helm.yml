name: Test deploy-argocd deploy with helm toolchain
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          cluster: "https://github.com/cloudposse-tests/argocd-config.git"
          aws-region: us-east-1
          path: "tests/fixtures/helm-chart"
          toolchain: helm
          operation: deploy
          environment: preview
          repository: "cloudposse/example-app"
          ref: "abc1234def5678901234567890123456789012ab"
          namespace: preview
          application: myapp
          image: "nginx"
          image-tag: "latest"
          github-pat: ${{ secrets.GITHUB_TOKEN }}
          synchronously: "false"
          helm-dependency-build: "false"
          helm-args: ""

      - name: Assert action ran (fails gracefully on non-existent argocd config repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected - argocd config repo not accessible)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
