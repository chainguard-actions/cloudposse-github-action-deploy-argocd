name: Test deploy with helm toolchain
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify helm toolchain inputs are documented
        run: |
          echo "This test verifies the action accepts helm toolchain inputs."
          echo "cluster: argocd-config-repo"
          echo "path: ./charts/myapp"
          echo "toolchain: helm"
          echo "namespace: dev"
          echo "application: myapp"
          echo "image: ghcr.io/myorg/myapp"
          echo "image-tag: sha-abc1234"
          echo "ref: abc1234"
          echo "repository: myorg/myapp"
          echo "github-pat: (secret)"
          echo "PASS: all helm toolchain inputs documented"

      - id: action
        uses: .
        continue-on-error: true
        with:
          cluster: "https://github.com/myorg/argocd-config"
          path: "./charts/myapp"
          toolchain: helm
          operation: deploy
          environment: preview
          namespace: dev
          application: myapp
          image: ghcr.io/myorg/myapp
          image-tag: "sha-abc1234"
          ref: "abc1234def5678901234567890123456789012ab"
          repository: myorg/myapp
          github-pat: "fake-pat-for-testing"
          helm-dependency-build: "false"
          helm-args: ""
          release_label_name: release
          synchronously: "false"

      - name: Assert action ran (may fail due to missing credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action is expected to fail in test environment (no real credentials/repos)
          # We just verify it was invoked with all required inputs for helm toolchain
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked with helm toolchain and all required inputs"
