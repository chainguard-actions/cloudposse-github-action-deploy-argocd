name: Test Deploy ArgoCD - Helm Toolchain Deploy
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal helm chart fixture
        run: |
          mkdir -p tests/fixtures/helm/templates
          cat > tests/fixtures/helm/Chart.yaml << 'EOF'
          apiVersion: v2
          name: myapp
          description: A test helm chart
          type: application
          version: 0.1.0
          appVersion: "1.0"
          EOF
          cat > tests/fixtures/helm/values.yaml << 'EOF'
          image:
            repository: nginx
            tag: latest
          global:
            image:
              repository: nginx
              tag: latest
          environment: preview
          ingress:
            default:
              hosts:
                example: test
          EOF
          cat > tests/fixtures/helm/templates/deployment.yaml << 'EOF'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: {{ .Release.Name }}
            namespace: {{ .Release.Namespace }}
            annotations:
              outputs.platform.cloudposse.com/webapp-url: "https://myapp.example.com"
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: {{ .Release.Name }}
            template:
              metadata:
                labels:
                  app: {{ .Release.Name }}
              spec:
                containers:
                - name: {{ .Release.Name }}
                  image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          cluster: "https://github.com/cloudposse/test-argocd-config.git"
          aws-region: us-east-1
          path: tests/fixtures/helm
          toolchain: helm
          operation: deploy
          environment: preview
          repository: cloudposse/test-app
          ref: abc1234def5678901234567890abcdef12345678
          namespace: preview
          application: myapp
          image: nginx
          image-tag: "1.25.0"
          github-pat: ${{ secrets.GITHUB_TOKEN }}
          synchronously: "false"
          helm-dependency-build: "false"

      - name: Assert helm deploy ran (fails gracefully on missing ArgoCD repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected - ArgoCD config repo not accessible)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
