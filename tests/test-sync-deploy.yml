name: Test synchronous deploy with commit-status-github-token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal helm chart for test
        run: |
          mkdir -p /tmp/test-chart/templates
          cat > /tmp/test-chart/Chart.yaml <<'EOF'
          apiVersion: v2
          name: test-app
          version: 0.1.0
          EOF
          cat > /tmp/test-chart/templates/deployment.yaml <<'EOF'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: test-app
            annotations:
              outputs.platform.cloudposse.com/webapp-url: "https://test.example.com"
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: test-app
            template:
              metadata:
                labels:
                  app: test-app
              spec:
                containers:
                  - name: test-app
                    image: nginx:latest
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          cluster: "https://github.com/cloudposse/test-argocd-config"
          path: /tmp/test-chart
          toolchain: helm
          operation: deploy
          environment: preview
          repository: cloudposse/test-app
          ref: abc1234def5678901234567890123456789012ab
          namespace: test-ns
          application: test-app
          image: nginx
          image-tag: latest
          github-pat: ${{ github.token }}
          commit-status-github-token: ${{ github.token }}
          synchronously: "false"
          kube-version: "1.28"

      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          WEBAPP_URL: ${{ steps.action.outputs.webapp-url }}
          SHA: ${{ steps.action.outputs.sha }}
        run: |
          echo "outcome: $OUTCOME"
          echo "webapp-url: $WEBAPP_URL"
          echo "sha: $SHA"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo / missing real cluster)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
