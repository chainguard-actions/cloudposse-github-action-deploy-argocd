name: Test destroy operation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify destroy inputs are documented
        run: |
          echo "This test verifies the action accepts destroy operation inputs."
          echo "cluster: my-cluster-repo"
          echo "namespace: production"
          echo "application: myapp"
          echo "image: ghcr.io/myorg/myapp"
          echo "image-tag: v1.0.0"
          echo "ref: deadbeef"
          echo "repository: myorg/myapp"
          echo "github-pat: (secret)"
          echo "commit-status-github-token: (secret)"
          echo "operation: destroy"
          echo "PASS: all destroy inputs documented"

      - id: action
        uses: .
        continue-on-error: true
        with:
          cluster: "https://github.com/myorg/argocd-config"
          path: "./charts/myapp"
          toolchain: helmfile
          operation: destroy
          environment: preview
          namespace: production
          application: myapp
          image: ghcr.io/myorg/myapp
          image-tag: "v1.0.0"
          ref: "deadbeef1234567890123456789012345678abcd"
          repository: myorg/myapp
          github-pat: "fake-pat-for-testing"
          commit-status-github-token: "fake-commit-status-token"

      - name: Assert action ran (may fail due to missing credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action is expected to fail in test environment (no real credentials/repos)
          # We just verify it was invoked with all required inputs including commit-status-github-token
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked with destroy operation and all required inputs"
