name: Test deploy-argocd destroy operation
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          cluster: "https://github.com/actionchain-harness/argocd-config.git"
          path: tests/fixtures/helm-chart
          toolchain: helm
          operation: destroy
          environment: preview
          repository: actionchain-harness/test-app
          ref: abc1234
          namespace: preview
          application: test-app
          image: nginx
          image-tag: "1.0.0"
          github-pat: ${{ github.token }}

      - name: Assert action ran (fails gracefully on non-existent ArgoCD config repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (ArgoCD config repo not accessible)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
