name: Test deploy-argocd destroy operation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test the destroy operation path. The action skips helmfile/helm rendering
      # for destroy and goes straight to git operations. It will fail at the
      # git checkout step (fake PAT), but we verify the action is invoked correctly.
      - id: action
        uses: .
        continue-on-error: true
        with:
          cluster: "https://github.com/cloudposse/example-app-on-eks.git"
          path: "./helmfile.yaml"
          operation: destroy
          environment: preview
          repository: "cloudposse/example-app"
          ref: "abc1234"
          namespace: "preview"
          application: "myapp"
          image: "nginx"
          image-tag: "latest"
          github-pat: "fake-pat-for-testing"
          aws-region: "us-east-1"

      - name: Assert action was invoked for destroy
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to be invoked"
            exit 1
          fi
          echo "PASS: action was invoked for destroy (outcome=$OUTCOME)"
