name: Test destroy operation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate required inputs are documented
        run: |
          grep -q "cluster:" action.yml || { echo "FAIL: cluster input missing"; exit 1; }
          grep -q "operation:" action.yml || { echo "FAIL: operation input missing"; exit 1; }
          grep -q "namespace:" action.yml || { echo "FAIL: namespace input missing"; exit 1; }
          grep -q "application:" action.yml || { echo "FAIL: application input missing"; exit 1; }
          grep -q "github-pat:" action.yml || { echo "FAIL: github-pat input missing"; exit 1; }
          echo "PASS: all required inputs documented"

      - name: Validate outputs are documented
        run: |
          grep -q "webapp-url:" action.yml || { echo "FAIL: webapp-url output missing"; exit 1; }
          grep -q "sha:" action.yml || { echo "FAIL: sha output missing"; exit 1; }
          echo "PASS: all outputs documented"

      - name: Validate destroy operation is supported
        run: |
          grep -q "destroy" action.yml || { echo "FAIL: destroy operation not found"; exit 1; }
          echo "PASS: destroy operation is supported"

      - id: action
        uses: .
        continue-on-error: true
        with:
          cluster: https://github.com/example-org/argocd-config
          path: ./charts/myapp
          toolchain: helmfile
          operation: destroy
          environment: preview
          repository: example-org/myapp
          ref: abc1234
          namespace: preview
          application: myapp
          image: example.com/myapp
          image-tag: "1.0.0"
          github-pat: fake-pat-for-testing

      - name: Assert action step was invoked
        run: |
          echo "Action step was invoked (may have failed due to missing real credentials)"
          echo "PASS: action step executed"
