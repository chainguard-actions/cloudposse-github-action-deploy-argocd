name: Test synchronous deploy with commit-status-github-token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          cluster: "git@github.com:example-org/argocd-config.git"
          path: "deploy/helmfile.yaml"
          toolchain: helmfile
          operation: deploy
          environment: preview
          repository: "example-org/example-app"
          ref: "abc1234def5678901234567890123456789012ab"
          namespace: preview
          application: my-app
          image: "nginx"
          image-tag: "latest"
          github-pat: ${{ github.token }}
          commit-status-github-token: ${{ github.token }}
          synchronously: "true"
          check-retry-count: "1"
          check-retry-interval: "5"
          commit-retry-count: "1"
          commit-retry-interval: "5"
          commit-timeout: "30"

      - name: Assert action ran (outputs set or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHA: ${{ steps.action.outputs.sha }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sha: $SHA"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SHA" ]; then
              echo "FAIL: action succeeded but sha output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with sha=$SHA"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo / missing real argocd config repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
