name: Test deploy with helmfile toolchain
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal helmfile for testing
        run: |
          mkdir -p tests/fixtures/helmfile-app
          cat > tests/fixtures/helmfile-app/helmfile.yaml <<'EOF'
          repositories:
            - name: stable
              url: https://charts.helm.sh/stable

          releases:
            - name: nginx
              namespace: preview
              chart: stable/nginx-ingress
              version: 1.41.3
              values:
                - platform.yaml
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          cluster: "https://github.com/example-org/argocd-config"
          path: "tests/fixtures/helmfile-app/helmfile.yaml"
          toolchain: helmfile
          operation: deploy
          environment: preview
          repository: "example-org/example-app"
          ref: "abc1234"
          namespace: preview
          application: nginx
          image: "nginx"
          image-tag: "latest"
          github-pat: "fake-pat-for-testing"

      - name: Assert action ran (fails gracefully when ArgoCD config repo is not accessible)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected - cannot access external ArgoCD config repo with fake PAT)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
