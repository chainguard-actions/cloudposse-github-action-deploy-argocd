name: Test deploy-argocd helmfile toolchain
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal helmfile for testing
        run: |
          mkdir -p tests/fixtures/helmfile-app
          cat > tests/fixtures/helmfile-app/helmfile.yaml <<'EOF'
          repositories:
            - name: stable
              url: https://charts.helm.sh/stable

          releases:
            - name: test-app
              namespace: {{ .Values.namespace | default "preview" }}
              chart: stable/nginx-ingress
              version: 1.41.3
              values:
                - image:
                    repository: {{ requiredEnv "IMAGE_NAME" }}
                    tag: {{ requiredEnv "IMAGE_TAG" }}
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          cluster: "https://github.com/actionchain-harness/argocd-config.git"
          path: tests/fixtures/helmfile-app/helmfile.yaml
          toolchain: helmfile
          operation: deploy
          environment: preview
          repository: actionchain-harness/test-app
          ref: abc1234
          namespace: preview
          application: test-app
          image: nginx
          image-tag: "1.0.0"
          github-pat: ${{ github.token }}

      - name: Assert action ran (fails gracefully on non-existent ArgoCD config repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (ArgoCD config repo or helmfile not accessible)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
