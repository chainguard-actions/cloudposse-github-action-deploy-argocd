name: Test synchronous mode input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test synchronous mode (expects failure at checkout step)
        id: action-sync
        uses: .
        continue-on-error: true
        with:
          cluster: "https://github.com/nonexistent-org-xyz-123/nonexistent-argocd-config-repo.git"
          path: "tests/fixtures/helmfile/helmfile.yaml"
          toolchain: helmfile
          operation: deploy
          environment: preview
          repository: "test-owner/test-app"
          ref: "abc1234def5678"
          namespace: "test-namespace"
          application: "test-app"
          image: "nginx"
          image-tag: "1.21.0"
          synchronously: "true"
          check-retry-count: "2"
          check-retry-interval: "5"
          github-pat: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert action failed (synchronous mode inputs accepted)
        env:
          OUTCOME: ${{ steps.action-sync.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the ArgoCD config repo doesn't exist
          # This confirms synchronously input is accepted and early steps work
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (nonexistent repo), got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly processed synchronous mode inputs and failed at checkout"
