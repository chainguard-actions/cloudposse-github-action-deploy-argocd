name: Test deploy-argocd synchronously with commit-status-github-token
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal helm chart for testing
        run: |
          mkdir -p tests/fixtures/helm-chart-sync/templates
          cat > tests/fixtures/helm-chart-sync/Chart.yaml <<'EOF'
          apiVersion: v2
          name: test-app
          description: A test chart
          type: application
          version: 0.1.0
          appVersion: "1.0"
          EOF
          cat > tests/fixtures/helm-chart-sync/values.yaml <<'EOF'
          image:
            repository: nginx
            tag: latest
          EOF
          cat > tests/fixtures/helm-chart-sync/templates/deployment.yaml <<'EOF'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: {{ .Release.Name }}
            namespace: {{ .Release.Namespace }}
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: {{ .Release.Name }}
            template:
              metadata:
                labels:
                  app: {{ .Release.Name }}
              spec:
                containers:
                - name: {{ .Release.Name }}
                  image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          cluster: "https://github.com/actionchain-harness/argocd-config.git"
          path: tests/fixtures/helm-chart-sync
          toolchain: helm
          operation: deploy
          environment: preview
          repository: actionchain-harness/test-app
          ref: abc1234
          namespace: preview
          application: test-app
          image: nginx
          image-tag: "1.0.0"
          kube-version: "1.28"
          github-pat: ${{ github.token }}
          commit-status-github-token: ${{ github.token }}
          synchronously: "true"
          check-retry-count: "1"
          check-retry-interval: "1"
          commit-retry-count: "1"
          commit-retry-interval: "1"

      - name: Assert action ran (fails gracefully on non-existent ArgoCD config repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHA: ${{ steps.action.outputs.sha }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sha: $SHA"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SHA" ]; then
              echo "FAIL: action succeeded but sha output is empty"
              exit 1
            fi
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (ArgoCD config repo not accessible)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
