name: Test Deploy ArgoCD - Helm Toolchain
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          cluster: "https://github.com/example-org/argocd-config.git"
          path: "deploy/chart"
          toolchain: helm
          operation: deploy
          environment: staging
          repository: "example-org/example-app"
          ref: "abc1234def5678901234567890123456789012ab"
          namespace: "staging"
          application: "my-app"
          image: "example.com/my-app"
          image-tag: "2.0.0"
          github-pat: "fake-pat-for-testing"
          synchronously: "false"
          helm-version: "v3.20.1"
          values_file: "values.yaml"

      - name: Assert helm toolchain deploy ran and failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected - no real ArgoCD config repo or PAT available)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
