name: Test deploy with commit-status-github-token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          cluster: "https://github.com/example-org/argocd-config"
          aws-region: us-east-1
          path: "apps/preview"
          toolchain: helmfile
          operation: deploy
          environment: preview
          repository: example-org/example-app
          ref: abc1234def5678901234567890abcdef12345678
          namespace: preview
          application: my-app
          image: nginx
          image-tag: "1.25.0"
          github-pat: ${{ github.token }}
          commit-status-github-token: ${{ github.token }}
          synchronously: "true"
          check-retry-count: "1"
          check-retry-interval: "5"
          commit-retry-count: "1"
          commit-retry-interval: "5"
          commit-timeout: "30"

      - name: Assert action ran (outputs set, or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          WEBAPP_URL: ${{ steps.action.outputs.webapp-url }}
          SHA: ${{ steps.action.outputs.sha }}
        run: |
          echo "outcome: $OUTCOME"
          echo "webapp-url: $WEBAPP_URL"
          echo "sha: $SHA"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness — sentinel repo, no real cluster)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
