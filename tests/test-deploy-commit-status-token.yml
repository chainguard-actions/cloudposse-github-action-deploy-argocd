name: Test deploy with commit-status-github-token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test deploy with explicit commit-status-github-token
        id: action
        uses: .
        continue-on-error: true
        with:
          cluster: git@github.com:example-org/argocd-config.git
          path: apps/preview
          toolchain: helmfile
          operation: deploy
          environment: preview
          repository: example-org/example-app
          ref: abc1234def5678901234567890abcdef12345678
          namespace: preview
          application: my-app
          image: nginx
          image-tag: latest
          github-pat: ${{ github.token }}
          commit-status-github-token: ${{ github.token }}
          synchronously: 'false'
          debug: 'false'

      - name: Assert action ran (failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
