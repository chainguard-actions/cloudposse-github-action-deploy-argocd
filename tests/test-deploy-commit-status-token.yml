name: Test Deploy ArgoCD - Synchronous Mode with commit-status-github-token
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The ArgoCD config repo does not exist / is not accessible under the harness,
      # so the checkout of the destination repo fails; assert on outcome only.
      - id: action
        uses: .
        continue-on-error: true
        with:
          cluster: "https://github.com/example-org/argocd-config.git"
          path: "deploy/helmfile.yaml"
          toolchain: helmfile
          operation: deploy
          environment: staging
          repository: "example-org/example-app"
          ref: "abc1234def5678901234567890123456789012ab"
          namespace: "staging"
          application: "my-app"
          image: "example.com/my-app"
          image-tag: "4.0.0"
          github-pat: ${{ github.token }}
          commit-status-github-token: ${{ github.token }}
          synchronously: "true"
          check-retry-count: "1"
          check-retry-interval: "1"
          commit-retry-count: "1"
          commit-retry-interval: "1"
          commit-timeout: "30"
          kube-version: "1.28"

      - name: Assert action ran and finished with a definite outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no accessible ArgoCD config repo)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
