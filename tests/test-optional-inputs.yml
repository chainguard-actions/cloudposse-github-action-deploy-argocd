name: Test optional inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test with optional inputs (expects failure at checkout step)
        id: action-optional
        uses: .
        continue-on-error: true
        with:
          cluster: "https://github.com/nonexistent-org-xyz-123/nonexistent-argocd-config-repo.git"
          path: "tests/fixtures/helm/chart"
          toolchain: helm
          operation: deploy
          environment: production
          repository: "test-owner/test-app"
          ref: "abc1234def5678"
          namespace: "prod-namespace"
          application: "prod-app"
          image: "myregistry/myapp"
          image-tag: "v3.0.0"
          values_file: "tests/fixtures/helm/values.yaml"
          release_label_name: "app-release"
          helm-args: "--timeout 5m"
          debug: "true"
          github-pat: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert action failed (optional inputs accepted)
        env:
          OUTCOME: ${{ steps.action-optional.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the ArgoCD config repo doesn't exist
          # This confirms optional inputs are accepted and early steps work
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (nonexistent repo), got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly processed optional inputs and failed at checkout"
