name: Test deploy with commit-status-github-token (synchronous mode)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          cluster: "https://github.com/example-org/example-argocd-config"
          aws-region: us-east-1
          path: ./deploy/helmfile.yaml
          toolchain: helmfile
          operation: deploy
          environment: preview
          repository: example-org/example-app
          ref: abc1234def5678901234567890abcdef12345678
          namespace: preview
          application: my-app
          image: nginx
          image-tag: "1.25.0"
          github-pat: ${{ github.token }}
          commit-status-github-token: ${{ github.token }}
          synchronously: "true"
          check-retry-count: "1"
          check-retry-interval: "5"
          commit-retry-count: "1"
          commit-retry-interval: "5"
          commit-timeout: "30"
          debug: "false"

      - name: Assert action ran (commit-status-github-token input accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will fail because the cluster URL is not a real accessible
          # ArgoCD config repo, but the important thing is that the action was
          # invoked with commit-status-github-token and did not error on input
          # validation (i.e., it proceeded past input parsing).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected - no real ArgoCD config repo accessible)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
