name: Test deploy with commit-status-github-token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          cluster: "https://github.com/example-org/argocd-config"
          aws-region: us-east-1
          path: ./charts/myapp
          toolchain: helm
          operation: deploy
          environment: preview
          repository: example-org/myapp
          ref: abc1234def5678901234567890123456789abcde
          namespace: preview
          application: myapp
          image: nginx
          image-tag: latest
          github-pat: fake-pat-for-input-coverage
          commit-status-github-token: fake-commit-status-token
          synchronously: "true"
          check-retry-count: "1"
          check-retry-interval: "5"
          commit-retry-count: "1"
          commit-retry-interval: "5"
          commit-timeout: "30"

      - name: Assert action ran (commit-status-github-token input covered)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (infrastructure available)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no real ArgoCD infrastructure)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
