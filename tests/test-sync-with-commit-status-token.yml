name: Test deploy with commit-status-github-token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          cluster: "https://github.com/test-org/argocd-config"
          aws-region: us-east-1
          path: ./charts/myapp
          toolchain: helmfile
          operation: deploy
          environment: preview
          repository: test-org/myapp
          ref: abc1234def5678901234567890abcdef12345678
          namespace: preview
          application: myapp
          image: nginx
          image-tag: "1.25.0"
          github-pat: ${{ secrets.GITHUB_TOKEN }}
          commit-status-github-token: ${{ secrets.GITHUB_TOKEN }}
          synchronously: "true"
          check-retry-count: "1"
          check-retry-interval: "5"
          commit-retry-count: "1"
          commit-retry-interval: "5"
          commit-timeout: "30"

      - name: Assert action ran (commit-status-github-token was passed and action ran or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo / missing ArgoCD config repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
