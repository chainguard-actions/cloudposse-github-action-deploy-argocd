name: Test deploy with commit-status-github-token (synchronous mode)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          cluster: "https://github.com/cloudposse/argocd-test-repo"
          aws-region: us-east-1
          path: ./deploy
          toolchain: helmfile
          operation: deploy
          environment: preview
          repository: cloudposse/test-app
          ref: abc1234
          namespace: test-ns
          application: test-app
          image: nginx
          image-tag: "1.21"
          github-pat: ${{ secrets.GITHUB_TOKEN }}
          commit-status-github-token: ${{ secrets.GITHUB_TOKEN }}
          synchronously: "true"
          check-retry-count: "1"
          check-retry-interval: "5"
          commit-retry-count: "1"
          commit-retry-interval: "5"
          commit-timeout: "30"

      - name: Assert action ran with commit-status-github-token input covered
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because the cluster URL points to a
          # non-existent ArgoCD config repo and the sentinel GITHUB_REPOSITORY
          # is not a real repo. What matters is that the commit-status-github-token
          # input was accepted and the action ran (not skipped).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (real infra available)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no real ArgoCD infra)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
