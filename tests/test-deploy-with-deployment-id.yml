name: Test deploy-argocd with deployment-id
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal helm chart for testing
        run: |
          mkdir -p tests/fixtures/helm-chart/templates
          cat > tests/fixtures/helm-chart/Chart.yaml <<'EOF'
          apiVersion: v2
          name: test-app
          description: A test chart
          type: application
          version: 0.1.0
          appVersion: "1.0"
          EOF
          cat > tests/fixtures/helm-chart/values.yaml <<'EOF'
          image:
            repository: nginx
            tag: latest
          global:
            image:
              repository: nginx
              tag: latest
          environment: preview
          ingress:
            default:
              hosts:
                example: test
          EOF
          cat > tests/fixtures/helm-chart/templates/deployment.yaml <<'EOF'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: {{ .Release.Name }}
            namespace: {{ .Release.Namespace }}
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: {{ .Release.Name }}
            template:
              metadata:
                labels:
                  app: {{ .Release.Name }}
              spec:
                containers:
                - name: {{ .Release.Name }}
                  image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          cluster: "https://github.com/actionchain-harness/argocd-config.git"
          path: tests/fixtures/helm-chart
          toolchain: helm
          operation: deploy
          environment: preview
          repository: actionchain-harness/test-app
          ref: abc1234
          namespace: preview
          application: test-app
          image: nginx
          image-tag: "1.0.0"
          github-pat: ${{ github.token }}
          deployment-id: "12345678-1"

      - name: Assert action ran (fails gracefully on non-existent ArgoCD config repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (ArgoCD config repo not accessible)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
