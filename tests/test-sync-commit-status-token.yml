name: Test Deploy ArgoCD - Synchronous mode with commit-status-github-token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal helm chart fixture
        run: |
          mkdir -p tests/fixtures/helm-sync/templates
          cat > tests/fixtures/helm-sync/Chart.yaml << 'EOF'
          apiVersion: v2
          name: myapp
          description: A test helm chart
          type: application
          version: 0.1.0
          appVersion: "1.0"
          EOF
          cat > tests/fixtures/helm-sync/values.yaml << 'EOF'
          image:
            repository: nginx
            tag: latest
          EOF
          cat > tests/fixtures/helm-sync/templates/deployment.yaml << 'EOF'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: {{ .Release.Name }}
            namespace: {{ .Release.Namespace }}
            annotations:
              outputs.platform.cloudposse.com/webapp-url: "https://myapp.example.com"
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: {{ .Release.Name }}
            template:
              metadata:
                labels:
                  app: {{ .Release.Name }}
              spec:
                containers:
                - name: {{ .Release.Name }}
                  image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          cluster: "https://github.com/cloudposse/test-argocd-config.git"
          path: tests/fixtures/helm-sync
          toolchain: helm
          operation: deploy
          environment: preview
          repository: cloudposse/test-app
          ref: abc1234def5678901234567890abcdef12345678
          namespace: preview
          application: myapp
          image: nginx
          image-tag: "1.25.0"
          kube-version: "1.28"
          github-pat: ${{ secrets.GITHUB_TOKEN }}
          commit-status-github-token: ${{ secrets.GITHUB_TOKEN }}
          synchronously: "true"
          check-retry-count: "1"
          check-retry-interval: "1"
          commit-retry-count: "1"
          commit-retry-interval: "1"

      - name: Assert synchronous deploy ran (fails gracefully on inaccessible ArgoCD repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHA: ${{ steps.action.outputs.sha }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sha: $SHA"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SHA" ]; then
              echo "FAIL: action succeeded but sha output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with sha $SHA"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (ArgoCD config repo / commit status not accessible)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
