name: Test deploy-argocd basic deploy
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires a real GitHub PAT and ArgoCD config repo to fully run.
      # We test that the action correctly parses the cluster URL (git URL) and
      # sets up the destination outputs. We use a public repo URL as the cluster
      # so the checkout step can succeed without a PAT.
      - id: action
        uses: .
        continue-on-error: true
        with:
          cluster: "https://github.com/cloudposse/example-app-on-eks.git"
          path: "./helmfile.yaml"
          operation: deploy
          environment: preview
          repository: "cloudposse/example-app"
          ref: "abc1234"
          namespace: "preview"
          application: "myapp"
          image: "nginx"
          image-tag: "latest"
          github-pat: "fake-pat-for-testing"
          aws-region: "us-east-1"
          toolchain: helmfile

      # The action will fail at the git checkout step (fake PAT), but we verify
      # that the action was invoked and the outcome is either success or failure
      # (not a configuration/syntax error that would prevent invocation).
      - name: Assert action was invoked
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to be invoked"
            exit 1
          fi
          echo "PASS: action was invoked (outcome=$OUTCOME)"
