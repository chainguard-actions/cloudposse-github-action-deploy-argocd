name: Test synchronous mode with commit-status-github-token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal helm chart for testing
        run: |
          mkdir -p tests/fixtures/sync-helm-chart/templates
          cat > tests/fixtures/sync-helm-chart/Chart.yaml <<'EOF'
          apiVersion: v2
          name: test-app
          description: A test Helm chart
          type: application
          version: 0.1.0
          appVersion: "1.0"
          EOF
          cat > tests/fixtures/sync-helm-chart/values.yaml <<'EOF'
          image:
            repository: nginx
            tag: latest
          EOF
          cat > tests/fixtures/sync-helm-chart/templates/configmap.yaml <<'EOF'
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: {{ .Release.Name }}
            namespace: {{ .Release.Namespace }}
          data:
            image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          EOF

      # The ArgoCD config repo cannot be pushed to under the harness, so the
      # action is expected to fail at checkout/push; the step must still not be skipped.
      - id: action
        uses: .
        continue-on-error: true
        with:
          cluster: "https://github.com/example-org/argocd-config"
          path: "tests/fixtures/sync-helm-chart"
          toolchain: helm
          operation: deploy
          environment: preview
          repository: "example-org/example-app"
          ref: "abc1234"
          namespace: preview
          application: test-app
          image: "nginx"
          image-tag: "1.21"
          github-pat: "fake-pat-for-testing"
          commit-status-github-token: "separate-commit-status-token"
          synchronously: "true"
          check-retry-count: "1"
          check-retry-interval: "1"
          commit-retry-count: "1"
          commit-retry-interval: "1"
          kube-version: "1.28"

      - name: Assert action ran (fails gracefully when ArgoCD config repo is not accessible)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHA: ${{ steps.action.outputs.sha }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sha: $SHA"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SHA" ]; then
              echo "FAIL: action succeeded but sha output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with sha $SHA"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (external ArgoCD config repo not accessible)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
