name: Test deploy with commit-status-github-token (synchronous mode)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run deploy action with commit-status-github-token
        id: action
        uses: .
        continue-on-error: true
        with:
          cluster: git@github.com:example-org/argocd-config.git
          path: apps/preview
          operation: deploy
          environment: preview
          repository: example-org/example-app
          ref: abc1234def5678901234567890123456789012ab
          namespace: preview
          application: my-app
          image: nginx
          image-tag: "1.25"
          github-pat: fake-pat-for-coverage
          commit-status-github-token: fake-commit-status-token
          synchronously: "true"
          check-retry-count: "1"
          check-retry-interval: "5"
          commit-retry-count: "1"
          commit-retry-interval: "5"
          commit-timeout: "30"

      - name: Assert action ran (expected to fail gracefully without real credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real ArgoCD repo/PAT)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
