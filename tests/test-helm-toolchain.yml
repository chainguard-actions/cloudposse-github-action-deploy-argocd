name: Test Deploy ArgoCD - Helm Toolchain
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          cluster: https://github.com/example-org/argocd-config.git
          aws-region: us-east-1
          path: ./charts/myapp
          toolchain: helm
          operation: deploy
          environment: staging
          repository: example-org/my-app
          ref: abc1234def5678901234567890abcdef12345678
          namespace: staging
          application: my-app
          image: ghcr.io/example-org/my-app
          image-tag: "2.0.0"
          github-pat: fake-pat-for-testing
          commit-status-github-token: fake-token-for-testing
          synchronously: "false"
          debug: "false"
          helm-dependency-build: "false"
          helm-args: ""
          values_file: ""
          release_label_name: release

      - name: Assert action ran (inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action is expected to fail at checkout (no real PAT/repo),
          # but it must have started (not skipped), confirming inputs were accepted.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, inputs may not have been accepted"
            exit 1
          fi
          echo "PASS: action ran with helm toolchain inputs"
