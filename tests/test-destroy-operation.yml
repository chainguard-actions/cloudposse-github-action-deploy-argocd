name: Test destroy operation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a temporary git repo to act as ArgoCD config repo
        id: setup-repo
        shell: bash
        run: |
          set -e
          # Create a bare git repo to simulate the ArgoCD config repo
          REPO_DIR="$(mktemp -d)"
          echo "repo_dir=$REPO_DIR" >> $GITHUB_OUTPUT

          git init "$REPO_DIR"
          cd "$REPO_DIR"
          git config user.email "test@example.com"
          git config user.name "Test"

          # Create a directory structure that the destroy operation would remove
          mkdir -p "github.com/test-owner/test-repo/test-namespace/test-app"
          echo "some content" > "github.com/test-owner/test-repo/test-namespace/test-app/config.yaml"
          git add -A
          git commit -m "Initial commit"

          echo "Repo created at $REPO_DIR"
          ls -la "$REPO_DIR"

      - name: Verify action fails gracefully with invalid cluster URL
        id: action-invalid-cluster
        uses: .
        continue-on-error: true
        with:
          cluster: "not-a-valid-git-url"
          path: "tests/fixtures/helmfile"
          operation: destroy
          repository: "test-owner/test-app"
          ref: "abc1234"
          namespace: "test-namespace"
          application: "test-app"
          image: "nginx"
          image-tag: "latest"
          github-pat: "fake-pat-for-invalid-cluster-test"

      - name: Assert action failed with invalid cluster
        env:
          OUTCOME: ${{ steps.action-invalid-cluster.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid cluster URL, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid cluster URL"
