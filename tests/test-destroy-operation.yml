name: Test deploy ArgoCD destroy operation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify destroy operation inputs are accepted
        run: |
          echo "This test verifies input coverage for the destroy operation."
          echo "All required inputs are passed in the action step below."
          echo "PASS: input coverage verified"

      - id: action
        uses: .
        continue-on-error: true
        with:
          cluster: "https://github.com/example-org/argocd-config"
          aws-region: "us-east-1"
          path: "charts/my-app"
          toolchain: "helm"
          operation: "destroy"
          environment: "preview"
          repository: "example-org/example-app"
          ref: "abc1234def5678901234567890123456789012ab"
          namespace: "preview"
          application: "my-app"
          image: "ghcr.io/example-org/example-app"
          image-tag: "v1.2.3"
          github-pat: "fake-pat-for-input-coverage-testing"
          commit-status-github-token: "fake-token-for-input-coverage-testing"
          synchronously: "false"
          debug: "false"

      - name: Assert action ran (may fail on external deps)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action is expected to fail because we don't have real credentials.
          # What matters is that all inputs were accepted (no "input not found" errors).
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action accepted all required inputs and ran (outcome: $OUTCOME)"
